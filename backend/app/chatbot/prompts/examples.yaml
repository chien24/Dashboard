- question: "Tháng này ngày nào chưa có ảnh Sorted?"
  answer:
    loai: sql
    sql: "WITH RECURSIVE d(ngay) AS (SELECT '2026-11-01' UNION ALL SELECT date(ngay, '+1 day') FROM d WHERE ngay < '2026-11-19') SELECT ngay AS ngay_thieu FROM d WHERE ngay NOT IN (SELECT ngay FROM v_report_quality WHERE loai = 'dmwcs_sorted' AND dang_hien_thi = 1) ORDER BY ngay"
    sql_postgres: "SELECT d::date AS ngay_thieu FROM generate_series('2026-11-01'::date, '2026-11-19'::date, '1 day') AS d WHERE d::date NOT IN (SELECT ngay FROM v_report_quality WHERE loai = 'dmwcs_sorted' AND dang_hien_thi = 1) ORDER BY 1"
    pham_vi: {he_thong: HT2, views: [v_report_quality], tu_ngay: "2026-11-01", den_ngay: "2026-11-19"}
    giai_thich: "Các ngày tháng này không có report Sorted đang hiển thị"

