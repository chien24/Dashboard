# Kho ví dụ cho few-shot động (fewshot.py): mỗi câu hỏi chỉ đưa CHAT_FEWSHOT_K ví dụ SQL gần nhất + mọi ví dụ hoi_lai/ngoai_pham_vi.
# Giả sử hôm nay = 2026-11-19 (thứ Năm). Không chép câu hỏi của tests/chatbot/eval_questions.yaml vào đây (lộ đáp án).
# Mọi SQL ở đây được test chạy được trên các view (tests/chatbot/test_pipeline.py).
- question: "Tỷ lệ NoRead 7 ngày gần nhất?"
  answer:
    loai: sql
    sql: "SELECT MIN(ngay) AS tu_ngay, MAX(ngay) AS den_ngay, COUNT(DISTINCT ngay) AS so_ngay_co_du_lieu, ROUND(100.0 * SUM(no_read_so_luong) / SUM(reject_chute), 2) AS ty_le_no_read_pct FROM v_dmwcs_sorted WHERE ngay BETWEEN '2026-11-13' AND '2026-11-19'"
    pham_vi: {he_thong: HT2, views: [v_dmwcs_sorted], tu_ngay: "2026-11-13", den_ngay: "2026-11-19"}
    giai_thich: "Tỷ lệ NoRead có trọng số trên RejectChute, 7 ngày gần nhất"

- question: "REJECT từng dây chuyền HT1 ngày gần nhất"
  answer:
    loai: sql
    sql: "SELECT s.ngay, s.day_chuyen, s.so_luong_da_quet AS all_kien, SUM(CASE WHEN a.loai_key IN ('NO_BARCODE', 'CHUTE_REQUEST_FAILED') THEN a.so_luong ELSE 0 END) AS reject_kien, ROUND(100.0 * SUM(CASE WHEN a.loai_key IN ('NO_BARCODE', 'CHUTE_REQUEST_FAILED') THEN a.so_luong ELSE 0 END) / s.so_luong_da_quet, 2) AS ty_le_reject_pct FROM v_scada_summary s LEFT JOIN v_scada_abnormal a ON a.report_id = s.report_id WHERE s.ngay = (SELECT MAX(ngay) FROM v_scada_summary) GROUP BY s.report_id, s.ngay, s.day_chuyen, s.so_luong_da_quet ORDER BY ty_le_reject_pct DESC"
    pham_vi: {he_thong: HT1, views: [v_scada_summary, v_scada_abnormal], tu_ngay: "2026-11-03", den_ngay: "2026-11-03"}
    giai_thich: "REJECT HT1 = Không Có Mã Vạch + Yêu cầu ống dẫn thất bại, theo dây chuyền, ngày gần nhất có dữ liệu"

