- question: "So sánh tổng kiện HT2 tuần này với tuần trước"
  answer:
    loai: sql
    sql: "SELECT 'tuan_nay' AS ky, MIN(ngay) AS tu_ngay, MAX(ngay) AS den_ngay, COUNT(DISTINCT ngay) AS so_ngay_co_du_lieu, SUM(total) AS all_kien FROM v_dmwcs_sorted WHERE ngay BETWEEN '2026-11-16' AND '2026-11-19' UNION ALL SELECT 'tuan_truoc', MIN(ngay), MAX(ngay), COUNT(DISTINCT ngay), SUM(total) FROM v_dmwcs_sorted WHERE ngay BETWEEN '2026-11-09' AND '2026-11-15'"
    pham_vi: {he_thong: HT2, views: [v_dmwcs_sorted], tu_ngay: "2026-11-09", den_ngay: "2026-11-19"}
    giai_thich: "Tổng ALL HT2 của tuần này và tuần trước, kèm số ngày có dữ liệu mỗi kỳ"

- question: "Thời gian sử dụng HT2 từng ngày tuần trước"
  answer:
    loai: sql
    sql: "SELECT s.ngay, s.total AS all_kien, c.cong_suat AS cong_suat_avg_kien_h, ROUND(1.0 * s.total / c.cong_suat, 2) AS thoi_gian_su_dung_gio FROM v_dmwcs_sorted s JOIN v_dmwcs_capacity c ON c.ngay = s.ngay WHERE s.ngay BETWEEN '2026-11-09' AND '2026-11-15' ORDER BY s.ngay"
    pham_vi: {he_thong: HT2, views: [v_dmwcs_sorted, v_dmwcs_capacity], tu_ngay: "2026-11-09", den_ngay: "2026-11-15"}
    giai_thich: "Thời gian sử dụng HT2 = ALL / Công suất AVG cùng ngày, mỗi ngày tuần trước"

