# 40 câu đánh giá chatbot (request/DAC_TA_CHATBOT.md mục 12), chạy trên fixtures/chat_eval.db.
# Hôm nay mặc định = 2026-11-16 (thứ Hai): hôm qua = 15/11, 7 ngày gần nhất = 10–16/11, tuần trước = 09–15/11.
# Chấm: reference_sql chạy trên cùng DB; mỗi dòng tham chiếu phải nằm trọn trong 1 dòng của bot (bot được trả thêm cột).
#   match: first  -> chỉ so N dòng đầu của bot (câu top-N)
#   match: values -> mọi giá trị tham chiếu phải xuất hiện đâu đó trong kết quả bot (bot có thể trả 1 hay 2 dòng)
# expect_answer_contains / expect_warning_contains: chuỗi phải có trong câu trả lời / danh sách cảnh báo.

# ------------------------------------------------------------ Tra số một ngày (10)
- id: q01
  question: "Hôm qua HT2 sorted tổng bao nhiêu kiện?"
  reference_sql: SELECT total FROM v_dmwcs_sorted WHERE ngay = '2026-11-15'
  tags: [mot_ngay, hom_qua]
- id: q02
  question: "Tỷ lệ REJECT HT2 hôm qua?"
  reference_sql: SELECT ROUND(100.0 * reject_chute / total, 2) FROM v_dmwcs_sorted WHERE ngay = '2026-11-15'
  tags: [mot_ngay, ty_le]
- id: q03
  question: "NoRead ngày 12/11 bao nhiêu kiện, chiếm bao nhiêu %?"
  reference_sql: SELECT no_read_so_luong, no_read_ty_le FROM v_dmwcs_sorted WHERE ngay = '2026-11-12'
  tags: [mot_ngay]
- id: q04
  question: "Công suất AVG ngày 14/11?"
  reference_sql: SELECT cong_suat FROM v_dmwcs_capacity WHERE ngay = '2026-11-14'
  tags: [mot_ngay, capacity]
- id: q05
  question: "BCR 6 hôm qua rate bao nhiêu?"
  reference_sql: SELECT rate FROM v_dmwcs_bcr WHERE ngay = '2026-11-15' AND bcr_no = 6
  tags: [mot_ngay, bcr]
- id: q06
  question: "Ngày 03/11 Outbound quét được bao nhiêu kiện?"
  reference_sql: SELECT so_luong_da_quet FROM v_scada_summary WHERE ngay = '2026-11-03' AND day_chuyen_key = 'outbound'
  tags: [mot_ngay, ht1]
- id: q07
  question: "Công suất MAX của Inbound ngày 3/11 là bao nhiêu, lúc mấy giờ?"
  reference_sql: SELECT cong_suat_cao_nhat_1h FROM v_scada_summary WHERE ngay = '2026-11-03' AND day_chuyen_key = 'inbound'
  tags: [mot_ngay, ht1]
- id: q08
  question: "REJECT HT1 của CBS1 tầng 2 ngày 03/11 là bao nhiêu kiện?"
  reference_sql: |
    SELECT SUM(so_luong) FROM v_scada_abnormal
    WHERE ngay = '2026-11-03' AND day_chuyen_key = 'cbs1 2st layer' AND loai_key IN ('NO_BARCODE', 'CHUTE_REQUEST_FAILED')
  tags: [mot_ngay, ht1, reject_ht1]
- id: q09
  question: "PDA ngày 10/11 bao nhiêu?"
  reference_sql: SELECT pda FROM v_dmwcs_sorted WHERE ngay = '2026-11-10'
  tags: [mot_ngay]
- id: q10
  question: "Thời gian sử dụng HT2 ngày 14/11?"
  reference_sql: |
    SELECT ROUND(1.0 * s.total / c.cong_suat, 2) FROM v_dmwcs_sorted s JOIN v_dmwcs_capacity c ON c.ngay = s.ngay
    WHERE s.ngay = '2026-11-14'
  tags: [mot_ngay, cong_thuc]

# ------------------------------------------------------------ Xu hướng, khoảng ngày (8)
- id: q11
  question: "Tỷ lệ NoRead 7 ngày gần nhất?"
  reference_sql: |
    SELECT ROUND(100.0 * SUM(no_read_so_luong) / SUM(reject_chute), 2) FROM v_dmwcs_sorted
    WHERE ngay BETWEEN '2026-11-10' AND '2026-11-16'
  tags: [khoang_ngay, ty_le_trong_so]
- id: q12
  question: "Công suất AVG 7 ngày gần nhất thế nào?"
  reference_sql: SELECT ngay, cong_suat FROM v_dmwcs_capacity WHERE ngay BETWEEN '2026-11-10' AND '2026-11-16' ORDER BY ngay
  tags: [khoang_ngay, capacity]
- id: q13
  question: "Tổng số kiện HT2 tuần trước?"
  reference_sql: SELECT SUM(total) FROM v_dmwcs_sorted WHERE ngay BETWEEN '2026-11-09' AND '2026-11-15'
  expect_warning_contains: ["11/11"]
  tags: [khoang_ngay, tuan_truoc]
- id: q14
  question: "Công suất AVG trung bình tuần trước?"
  reference_sql: SELECT ROUND(AVG(cong_suat), 2) FROM v_dmwcs_capacity WHERE ngay BETWEEN '2026-11-09' AND '2026-11-15'
  tags: [khoang_ngay, capacity, tuan_truoc]
- id: q15
  question: "Rate của BCR 1 tính chung từ 10/11 đến 15/11?"
  reference_sql: |
    SELECT ROUND(100.0 * SUM(success) / SUM(total), 2) FROM v_dmwcs_bcr
    WHERE bcr_no = 1 AND ngay BETWEEN '2026-11-10' AND '2026-11-15'
  tags: [khoang_ngay, bcr, ty_le_trong_so]
- id: q16
  question: "Tách tỷ lệ REJECT HT2 theo từng ngày tuần trước"
  reference_sql: |
    SELECT ngay, ROUND(100.0 * reject_chute / total, 2) FROM v_dmwcs_sorted
    WHERE ngay BETWEEN '2026-11-09' AND '2026-11-15' ORDER BY ngay
  tags: [khoang_ngay, theo_ngay]
- id: q17
  question: "Tổng REJECT HT2 tháng này"
  reference_sql: SELECT SUM(reject_chute) FROM v_dmwcs_sorted WHERE ngay BETWEEN '2026-11-01' AND '2026-11-16'
  tags: [khoang_ngay, thang_nay]
- id: q18
  history:
    - question: "Số kiện NoChute ngày 12/11?"
      sql: "SELECT ngay, no_chute_so_luong AS no_chute_kien FROM v_dmwcs_sorted WHERE ngay = '2026-11-12'"
  question: "Còn từ 13/11 đến 15/11 thì sao? Tách theo từng ngày giúp tôi"
  reference_sql: |
    SELECT ngay, no_chute_so_luong FROM v_dmwcs_sorted WHERE ngay BETWEEN '2026-11-13' AND '2026-11-15' ORDER BY ngay
  tags: [khoang_ngay, noi_tiep]

# ------------------------------------------------------------ So sánh, top/bottom (6)
- id: q19
  question: "Dây chuyền nào quét nhiều kiện nhất ngày 03/11?"
  reference_sql: |
    SELECT day_chuyen, so_luong_da_quet FROM v_scada_summary WHERE ngay = '2026-11-03' ORDER BY so_luong_da_quet DESC LIMIT 1
  match: first
  tags: [so_sanh, ht1]
- id: q20
  question: "Top 3 loại bất thường của Outbound ngày 03/11"
  reference_sql: |
    SELECT loai_vi, SUM(so_luong) FROM v_scada_abnormal WHERE ngay = '2026-11-03' AND day_chuyen_key = 'outbound'
    GROUP BY loai_key, loai_vi ORDER BY 2 DESC LIMIT 3
  match: first
  tags: [top, ht1]
- id: q21
  question: "BCR nào có rate thấp nhất hôm qua?"
  reference_sql: SELECT bcr_no, rate FROM v_dmwcs_bcr WHERE ngay = '2026-11-15' ORDER BY rate LIMIT 1
  match: first
  tags: [top, bcr]
- id: q22
  question: "Liệt kê các BCR có rate dưới 85% ngày 15/11"
  reference_sql: SELECT bcr_no, rate FROM v_dmwcs_bcr WHERE ngay = '2026-11-15' AND rate < 85
  tags: [so_sanh, bcr]
- id: q23
  question: "Ngày nào tuần trước có tỷ lệ REJECT HT2 cao nhất?"
  reference_sql: |
    SELECT ngay, ROUND(100.0 * reject_chute / total, 2) FROM v_dmwcs_sorted
    WHERE ngay BETWEEN '2026-11-09' AND '2026-11-15' ORDER BY 2 DESC LIMIT 1
  match: first
  tags: [top, tuan_truoc]
- id: q24
  question: "Những máng nào xuất hiện trong NoChute từ 5 ngày trở lên trong tuần trước?"
  reference_sql: |
    SELECT chute_no FROM v_dmwcs_no_chute WHERE ngay BETWEEN '2026-11-09' AND '2026-11-15'
    GROUP BY chute_no HAVING COUNT(DISTINCT ngay) >= 5
  expect_warning_contains: ["bị cắt"]
  tags: [top, no_chute]

