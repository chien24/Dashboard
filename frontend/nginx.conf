# FE: phục vụ HTML/CSS/JS; /api/ và /uploads/ chuyển sang BE qua cổng 8000 (giống vercel.json). Chạy bằng user thường, cổng 8080.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;   # đi qua Cloudflare Tunnel: giữ https để BE đặt cookie Secure
    ""      $scheme;
}

server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;   # chuyển hướng tương đối: không lộ cổng nội bộ 8080 (ngoài máy là 8000 / tunnel)
    root /usr/share/nginx/html;
    client_max_body_size 200m;   # 1 lần tải được nhiều ảnh (mỗi ảnh BE vẫn chặn theo MAX_UPLOAD_MB)

    # tên "backend" phân giải lại mỗi 10 giây: BE tạo lại (đổi IP) thì FE không cần khởi động lại
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = / {
        return 302 /html/index.html;
    }

    # API, ảnh đã upload, Swagger: BE kiểm tra đăng nhập
    location ~ ^/(api|uploads)/|^/(docs|redoc|openapi\.json)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # BE khóa đăng nhập theo IP thật
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;   # chatbot / OCR có thể chờ model lâu
        proxy_send_timeout 300s;
        proxy_hide_header X-Content-Type-Options;   # BE đã gửi, tránh lặp header
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;   # sửa HTML/CSS/JS là thấy ngay (như BE trước đây)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
