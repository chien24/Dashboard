<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem / sửa report</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<script>try { if (+localStorage.getItem("jail_until") > Date.now()) location.replace("jail.html"); const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="../css/base.css?v=8">
<link rel="stylesheet" href="../css/upload.css?v=4">
</head>
<body>
<header class="brandbar"><a class="logo" href="index.html"><img src="../img/logo_viettel_post.webp" alt="Viettel Post" width="103" height="40"></a>
  <span class="brand">OCR Dashboard CNKT3</span>
  <button class="theme-btn" id="theme-btn" type="button"></button></header>
<nav class="topnav">
  <a href="index.html">Thiên Cơ Các</a><a href="upload.html">Truyền Pháp Ảnh</a><a href="history.html">Tàng Kinh Các</a><a href="chat.html">Vấn Đạo Đài</a><a href="thoi-gian.html">Đạo Vận Chi Lượng</a></nav>
<main>
  <h1 id="title">Report</h1>
  <p class="sub" id="meta"></p>
  <div id="warns"></div>
  <div class="report">
    <div class="viewer" id="viewer" title="Bấm để phóng to / thu nhỏ"><p class="hint" style="padding:12px">Không có ảnh gốc (report import từ JSON).</p></div>
    <div>
      <form class="form" id="form"></form>
      <div class="actions">
        <button class="btn primary" id="save" type="button">Lưu</button>
        <button class="btn" id="add-row" type="button" hidden>Thêm giá trị</button>
        <button class="btn" id="reocr" type="button">OCR lại</button>
        <span id="msg" class="hint" aria-live="polite"></span>
      </div>
      <section class="versions"><h2>OCR Version</h2><div id="versions"></div></section>
      <div class="actions"><button class="btn" id="delete">Xóa report</button></div>
    </div>
  </div>
</main>
<script src="../js/api.js?v=8"></script>
<script src="../js/chat-widget.js?v=3"></script>
<script src="../js/report.js?v=4"></script>
</body>
</html>
