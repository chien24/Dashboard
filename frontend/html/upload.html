<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload ảnh OCR</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<script>try { if (+localStorage.getItem("jail_until") > Date.now()) location.replace("jail.html"); const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="../css/base.css?v=5">
<link rel="stylesheet" href="../css/upload.css?v=3">
</head>
<body>
<header class="brandbar"><a class="logo" href="index.html"><img src="../img/logo_viettel_post.webp" alt="Viettel Post" width="103" height="40"></a>
  <span class="brand">OCR Dashboard CNKT3</span>
  <button class="theme-btn" id="theme-btn" type="button"></button></header>
<nav class="topnav">
  <a href="index.html">Dashboard</a><a href="upload.html" aria-current="page">Upload ảnh</a><a href="history.html">Lịch sử</a></nav>
<main>
  <h1>Upload ảnh chụp màn hình</h1>
  <p class="sub">SCADA hoặc DMWCS (Sorted, Capacity, BCR rate). Ảnh JPG / PNG, nhiều ảnh một lần. OCR chạy lần lượt từng ảnh.</p>

  <label class="drop" id="drop">
    <input type="file" id="pick" accept=".jpg,.jpeg,.png,.webp" multiple hidden>
    <b>Kéo thả ảnh vào đây</b> hoặc bấm để chọn
  </label>

  <div class="filters">
    <label>Loại cho tất cả ảnh
      <select id="loai-all">
        <option value="">Tự nhận diện</option>
        <option value="scada">SCADA</option><option value="dmwcs_sorted">DMWCS Sorted</option>
        <option value="dmwcs_capacity">DMWCS Capacity</option><option value="dmwcs_bcr_rate">DMWCS BCR rate</option>
      </select></label>
    <button class="btn primary" id="start" disabled>Bắt đầu OCR</button>
    <button class="btn" id="clear">Xóa danh sách</button>
    <span class="hint">"Tự nhận diện" tốn thêm 1 lần gọi API mỗi ảnh.</span>
  </div>

  <div id="items"></div>
</main>
<div id="toasts" aria-live="polite"></div>
<script src="../js/api.js?v=3"></script>
<script src="../js/upload.js?v=4"></script>
</body>
</html>
